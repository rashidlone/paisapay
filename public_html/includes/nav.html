<!-- ALL DROPDOWN ITEMS VISIBLE - NO BALANCE -->

<!-- This is loaded standalone inside an <iframe>, so it needs its own
     stylesheet link — Font Awesome wasn't loaded here before, which meant
     the wallet logo icon and dropdown arrow likely weren't rendering. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    /* ✅ Everything transparent except dropdown */
    * {
        overflow: visible !important;
    }
    
    html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        overflow: visible !important;
        height: auto !important;
        min-height: 56px !important;
    }
    
    .pp-top-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: rgba(17, 24, 39, 0.96);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        padding: 0 16px;
        height: 56px;
        display: flex;
        align-items: center;
        font-family: 'Inter', sans-serif;
        overflow: visible !important;
        min-height: 56px;
    }
    
    .pp-nav-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        overflow: visible !important;
    }
    
    .pp-nav-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        font-weight: 800;
        font-size: 18px;
        color: #ffffff;
        flex-shrink: 0;
        cursor: pointer;
    }
    
    .pp-nav-logo i {
        font-size: 20px;
        color: #8B5CF6;
    }
    
    .pp-nav-logo span {
        background: linear-gradient(135deg, #6C3CE1, #9B59B6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    .pp-nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        overflow: visible !important;
    }
    
    .pp-profile-dropdown {
        position: relative;
        display: inline-block;
        overflow: visible !important;
    }
    
    .pp-profile-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 4px 4px 0;
        background: transparent;
        border: none;
        color: #e2e8f0;
        cursor: pointer;
        border-radius: 30px;
        transition: all 0.3s ease;
    }
    
    .pp-profile-btn .pp-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6C3CE1, #9B59B6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        color: white;
        flex-shrink: 0;
    }
    
    .pp-profile-btn .pp-arrow {
        color: #64748b;
        font-size: 12px;
        transition: transform 0.3s ease;
    }
    
    .pp-profile-btn.open .pp-arrow {
        transform: rotate(180deg);
    }
    
    /* ✅ DROPDOWN - FULL VISIBLE */
    .pp-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: -10px;
        min-width: 240px;
        background: rgba(17, 24, 39, 0.98);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 14px;
        padding: 8px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        z-index: 999999 !important;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px) scale(0.96);
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        display: block !important;
        pointer-events: none;
        max-height: none !important;
        overflow: visible !important;
    }
    
    .pp-dropdown.open {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translateY(0) scale(1) !important;
        pointer-events: auto !important;
    }
    
    .pp-dropdown .pp-dropdown-header {
        padding: 10px 14px 8px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        margin-bottom: 4px;
    }
    
    .pp-dropdown .pp-dropdown-header .pp-user-name {
        font-weight: 600;
        font-size: 14px;
        color: #ffffff;
    }
    
    .pp-dropdown .pp-dropdown-header .pp-user-email {
        font-size: 12px;
        color: #64748b;
        margin-top: 2px;
        word-break: break-all;
    }
    
    .pp-dropdown .pp-dropdown-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 10px;
        color: #e2e8f0;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
        cursor: pointer;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
    }
    
    .pp-dropdown .pp-dropdown-item:hover {
        background: rgba(255,255,255,0.06);
        color: #ffffff;
    }
    
    .pp-dropdown .pp-dropdown-item i {
        width: 18px;
        font-size: 14px;
        color: #64748b;
        text-align: center;
    }
    
    .pp-dropdown .pp-dropdown-item.danger {
        color: #ef4444;
    }
    
    .pp-dropdown .pp-dropdown-item.danger i {
        color: #ef4444;
    }
    
    .pp-dropdown .pp-dropdown-item.danger:hover {
        background: rgba(239,68,68,0.1);
    }
    
    .pp-dropdown .pp-dropdown-divider {
        height: 1px;
        background: rgba(255,255,255,0.06);
        margin: 4px 8px;
    }

    /* ✅ NOTIFICATION BELL */
    .pp-notif-wrap {
        position: relative;
        overflow: visible !important;
    }

    .pp-notif-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: transparent;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        border-radius: 50%;
        transition: all 0.2s ease;
        position: relative;
        font-size: 16px;
    }

    .pp-notif-btn:hover {
        background: rgba(255,255,255,0.06);
        color: #ffffff;
    }

    .pp-notif-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        background: #ef4444;
        border: 2px solid rgba(17, 24, 39, 0.96);
        border-radius: 10px;
        color: #ffffff;
        font-size: 10px;
        font-weight: 700;
        line-height: 12px;
        text-align: center;
        display: none;
    }

    .pp-notif-badge.show {
        display: block;
    }

    .pp-notif-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: -10px;
        width: 320px;
        max-width: calc(100vw - 32px);
        background: rgba(17, 24, 39, 0.98);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        z-index: 999999 !important;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px) scale(0.96);
        transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
        overflow: hidden;
    }

    .pp-notif-panel.open {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translateY(0) scale(1) !important;
        pointer-events: auto !important;
    }

    .pp-notif-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .pp-notif-header span.title {
        font-weight: 600;
        font-size: 14px;
        color: #ffffff;
    }

    .pp-notif-mark-all {
        background: transparent;
        border: none;
        color: #8B5CF6;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        padding: 2px 4px;
    }

    .pp-notif-mark-all:hover {
        text-decoration: underline;
    }

    .pp-notif-list {
        max-height: 340px;
        overflow-y: auto;
    }

    .pp-notif-item {
        display: flex;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        cursor: pointer;
        transition: background 0.15s ease;
    }

    .pp-notif-item:hover {
        background: rgba(255,255,255,0.04);
    }

    .pp-notif-item:last-child {
        border-bottom: none;
    }

    .pp-notif-dot {
        flex-shrink: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8B5CF6;
        margin-top: 6px;
    }

    .pp-notif-item.read .pp-notif-dot {
        background: transparent;
    }

    .pp-notif-body .pp-notif-title {
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 2px;
    }

    .pp-notif-item.read .pp-notif-body .pp-notif-title {
        color: #94a3b8;
        font-weight: 500;
    }

    .pp-notif-body .pp-notif-message {
        font-size: 12px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 4px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .pp-notif-body .pp-notif-time {
        font-size: 11px;
        color: #64748b;
    }

    .pp-notif-empty {
        padding: 32px 14px;
        text-align: center;
        color: #64748b;
        font-size: 13px;
    }

    .pp-notif-empty i {
        font-size: 24px;
        display: block;
        margin-bottom: 8px;
        opacity: 0.5;
    }
    
    /* ✅ Fix for mobile */
    @media (max-width: 480px) {
        .pp-top-nav {
            height: 50px;
            min-height: 50px;
            padding: 0 12px;
        }
        .pp-nav-logo {
            font-size: 16px;
        }
        .pp-nav-logo i {
            font-size: 18px;
        }
        .pp-profile-btn .pp-avatar {
            width: 28px;
            height: 28px;
            font-size: 12px;
        }
        .pp-profile-btn .pp-arrow {
            display: none;
        }
        .pp-dropdown {
            right: -10px;
            min-width: 200px;
        }
        .pp-notif-btn {
            width: 32px;
            height: 32px;
            font-size: 15px;
        }
        .pp-notif-panel {
            right: -60px;
            width: 300px;
        }
        .pp-dropdown .pp-dropdown-item {
            font-size: 12px;
            padding: 8px 12px;
        }
    }
</style>

<nav class="pp-top-nav" id="ppTopNav">
    <div class="pp-nav-container">
        <a href="/dashboard.html" target="_top" class="pp-nav-logo">
            <i class="fas fa-wallet"></i>
            <span>PaisaPay</span>
        </a>
        
        <div class="pp-nav-right">
            <div class="pp-notif-wrap" id="ppNotifWrap">
                <button class="pp-notif-btn" id="ppNotifToggle" aria-label="Notifications">

                <div class="pp-notif-panel" id="ppNotifPanel">
                    <div class="pp-notif-header">
                        <span class="title">Notifications</span>
                        <button class="pp-notif-mark-all" id="ppNotifMarkAll">Mark all read</button>
                    </div>
                    <div class="pp-notif-list" id="ppNotifList">
                        <div class="pp-notif-empty">
                            <i class="fas fa-bell-slash"></i>
                            No notifications yet
                        </div>
                    </div>
                </div>
            </div>

            <div class="pp-profile-dropdown" id="ppProfileDropdown">
                <button class="pp-profile-btn" id="ppProfileToggle">
                    <span class="pp-avatar" id="ppNavAvatar">U</span>
                    <i class="fas fa-chevron-down pp-arrow"></i>
                </button>
                
                <div class="pp-dropdown" id="ppDropdownMenu">
                    <div class="pp-dropdown-header">
                        <div class="pp-user-name" id="ppNavUserName">User</div>
                        <div class="pp-user-email" id="ppNavUserEmail">user@email.com</div>
                    </div>
                    
                    <a href="/profile.html" target="_top" class="pp-dropdown-item">
                        <i class="fas fa-user"></i> My Profile
                    </a>
                    <a href="/activity.html" target="_top" class="pp-dropdown-item">
                        <i class="fas fa-history"></i> Activity
                    </a>
                    <a href="/settings.html" target="_top" class="pp-dropdown-item">
                        <i class="fas fa-cog"></i> Settings
                    </a>

                    <a href="/help.html" target="_top" class="pp-dropdown-item">

<script>
    // ============================================
    // ✅ DROPDOWN TOGGLE
    // ============================================
    
    var toggleBtn = document.getElementById('ppProfileToggle');
    var dropdownMenu = document.getElementById('ppDropdownMenu');
    var notifToggleBtn = document.getElementById('ppNotifToggle');
    var notifPanel = document.getElementById('ppNotifPanel');
    
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // Opening the profile menu closes the notification panel, and vice
            // versa below — only one flyout open at a time.
            if (notifPanel) notifPanel.classList.remove('open');
            if (notifToggleBtn) notifToggleBtn.classList.remove('open');
            
            if (dropdownMenu) {
                dropdownMenu.classList.toggle('open');
                
                if (dropdownMenu.classList.contains('open')) {
                    window.parent.postMessage({ type: 'expandNav' }, '*');
                } else {
                    window.parent.postMessage({ type: 'collapseNav' }, '*');
                }
            }
            this.classList.toggle('open');
        });
    }
    
    if (notifToggleBtn) {
        notifToggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            if (dropdownMenu) dropdownMenu.classList.remove('open');
            if (toggleBtn) toggleBtn.classList.remove('open');
            
            if (notifPanel) {
                notifPanel.classList.toggle('open');
                
                if (notifPanel.classList.contains('open')) {
                    window.parent.postMessage({ type: 'expandNav' }, '*');
                    ppLoadNotifications(); // refresh the list every time it's opened
                } else {
                    window.parent.postMessage({ type: 'collapseNav' }, '*');
                }
            }
            this.classList.toggle('open');
        });
    }
    
    // Close dropdown on outside click
    document.addEventListener('click', function(e) {
        var container = document.getElementById('ppProfileDropdown');
        if (container && !container.contains(e.target)) {
            if (dropdownMenu) {
                dropdownMenu.classList.remove('open');
                window.parent.postMessage({ type: 'collapseNav' }, '*');
            }
            if (toggleBtn) toggleBtn.classList.remove('open');
        }
        
        var notifContainer = document.getElementById('ppNotifWrap');
        if (notifContainer && !notifContainer.contains(e.target)) {
            if (notifPanel) {
                notifPanel.classList.remove('open');
                window.parent.postMessage({ type: 'collapseNav' }, '*');
            }
            if (notifToggleBtn) notifToggleBtn.classList.remove('open');
        }
    });
    
    // Close on Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (dropdownMenu) {
                dropdownMenu.classList.remove('open');
                window.parent.postMessage({ type: 'collapseNav' }, '*');
            }
            if (toggleBtn) toggleBtn.classList.remove('open');
            
            if (notifPanel) {
                notifPanel.classList.remove('open');
                window.parent.postMessage({ type: 'collapseNav' }, '*');
            }
            if (notifToggleBtn) notifToggleBtn.classList.remove('open');
        }
    });
    
    // ============================================
    // ✅ UPDATE NAV
    // ============================================
    
    function ppUpdateNav() {
        try {
            var userData = localStorage.getItem('user_data');
            if (userData) {
                var user = JSON.parse(userData);
                
                var avatar = document.getElementById('ppNavAvatar');
                if (avatar) {
                    avatar.textContent = (user.full_name || 'U')[0].toUpperCase();
                }
                
                var userName = document.getElementById('ppNavUserName');
                var userEmail = document.getElementById('ppNavUserEmail');
                if (userName) userName.textContent = user.full_name || 'User';
                if (userEmail) userEmail.textContent = user.email || 'user@email.com';
            }
        } catch (e) {
            console.error('PP Nav error:', e);
        }
    }
    
    function ppLogout() {
        if (confirm('Are you sure you want to logout?')) {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_data');
            window.top.location.href = '/login.html';
        }
    }
    
    // ============================================
    // ✅ NOTIFICATIONS
    // ============================================
    
    var ppNotifPollTimer = null;
    
    function ppTimeAgo(dateStr) {
        // Safari/iOS won't parse "YYYY-MM-DD HH:MM:SS" reliably — normalize to ISO-ish first.
        var d = new Date(dateStr.replace(' ', 'T') + 'Z');
        if (isNaN(d.getTime())) d = new Date(dateStr);
        var seconds = Math.floor((Date.now() - d.getTime()) / 1000);
        if (seconds < 60) return 'Just now';
        var minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + 'm ago';
        var hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + 'h ago';
        var days = Math.floor(hours / 24);
        if (days < 7) return days + 'd ago';
        return d.toLocaleDateString();
    }
    
    function ppEscapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }
    
    function ppUpdateBadge(count) {
        var badge = document.getElementById('ppNotifBadge');
        if (!badge) return;
        if (count > 0) {
            badge.textContent = count > 99 ? '99+' : String(count);
            badge.classList.add('show');
        } else {
            badge.classList.remove('show');
        }
    }
    
    function ppRenderNotifications(notifications) {
        var list = document.getElementById('ppNotifList');
        if (!list) return;
        
        if (!notifications || notifications.length === 0) {
            list.innerHTML = '<div class="pp-notif-empty"><i class="fas fa-bell-slash"></i>No notifications yet</div>';
            return;
        }
        
        list.innerHTML = notifications.map(function(n) {
            var isRead = String(n.is_read) === '1';
            return '' +
                '<div class="pp-notif-item' + (isRead ? ' read' : '') + '" data-id="' + n.id + '">' +
                    '<div class="pp-notif-dot"></div>' +
                    '<div class="pp-notif-body">' +
                        '<div class="pp-notif-title">' + ppEscapeHtml(n.title) + '</div>' +
                        '<div class="pp-notif-message">' + ppEscapeHtml(n.message) + '</div>' +
                        '<div class="pp-notif-time">' + ppTimeAgo(n.created_at) + '</div>' +
                    '</div>' +
                '</div>';
        }).join('');
        
        list.querySelectorAll('.pp-notif-item').forEach(function(item) {
            item.addEventListener('click', function() {
                if (!item.classList.contains('read')) {
                    ppMarkNotificationRead(item.getAttribute('data-id'), item);
                }
            });
        });
    }
    
    function ppMarkNotificationRead(id, itemEl) {
        var token = localStorage.getItem('auth_token');
        if (!token) return;
        
        // Update immediately so it feels instant; the request just persists it.
        if (itemEl) itemEl.classList.add('read');
        var badge = document.getElementById('ppNotifBadge');
        if (badge) {
            var current = parseInt(badge.textContent, 10);
            if (!isNaN(current)) ppUpdateBadge(Math.max(0, current - 1));
        }
        
        fetch('/api/notifications/mark-read.php', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id: id })
        }).catch(function(err) {
            console.warn('PP Notif mark-read error:', err);
        });
    }
    
    function ppMarkAllRead() {
        var token = localStorage.getItem('auth_token');
        if (!token) return;
        
        document.querySelectorAll('.pp-notif-item').forEach(function(item) {
            item.classList.add('read');
        });
        ppUpdateBadge(0);
        
        fetch('/api/notifications/mark-read.php', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ all: true })
        }).catch(function(err) {
            console.warn('PP Notif mark-all error:', err);
        });
    }
    
    function ppLoadNotifications() {
        var token = localStorage.getItem('auth_token');
        if (!token) return; // not logged in — nothing to show
        
        fetch('/api/notifications/list.php?limit=20', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(function(res) { return res.json(); })
            .then(function(json) {
                if (!json.success || !json.data) return;
                ppUpdateBadge(json.data.unread_count || 0);
                ppRenderNotifications(json.data.notifications);
            })
            .catch(function(err) {
                console.warn('PP Notif load error:', err);
            });
    }
    
    var markAllBtn = document.getElementById('ppNotifMarkAll');
    if (markAllBtn) {
        markAllBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            ppMarkAllRead();
        });
    }
    
    window.ppUpdateNav = ppUpdateNav;
    window.ppLogout = ppLogout;
    window.ppLoadNotifications = ppLoadNotifications;
    
    document.addEventListener('DOMContentLoaded', function() {
        ppUpdateNav();
        ppLoadNotifications();
        
        // Poll for new notifications every 45s rather than opening a
        // persistent connection — simple and good enough for this use case.
        if (ppNotifPollTimer) clearInterval(ppNotifPollTimer);
        ppNotifPollTimer = setInterval(ppLoadNotifications, 45000);
    });
    
    console.log('✅ Nav loaded - No balance display');
</script>
