    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* ============================================
           SIGNUP PAGE STYLES
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(108, 60, 225, 0.08), transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(155, 89, 182, 0.05), transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        
        .signup-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .signup-card {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        
        .signup-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6C3CE1, #9B59B6, #6C3CE1);
            background-size: 200% 100%;
            animation: shimmerBorder 3s ease-in-out infinite;
        }
        
        @keyframes shimmerBorder {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* ============================================
           TOAST STYLES
           ============================================ */
        
        .toast-container {
            position: fixed !important;
            bottom: 30px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 999999 !important;
        }
        
        .toast {
            background: #111827 !important;
            border: 1px solid #1e293b !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
        }
        
        .toast .toast-body {
            font-size: 14px;
            font-weight: 500;
            padding: 12px 16px;
        }
        
        .toast.bg-success .toast-body { color: #10b981; }
        .toast.bg-danger .toast-body { color: #f87171; }
        .toast.bg-warning .toast-body { color: #fbbf24; }
        .toast.bg-info .toast-body { color: #60a5fa; }
        
        @media (max-width: 480px) {
            .toast-container {
                bottom: 20px !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                right: auto !important;
                width: 100% !important;
                max-width: 90% !important;
                padding: 0 !important;
            }
        }
        
        /* ============================================
           ALERTS
           ============================================ */
        
        .alert-container {
            margin-bottom: 12px;
        }
        
        .alert-custom {
            display: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.3s ease-out;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .alert-custom.show {
            display: flex;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        
        .alert-error i {
            color: #ef4444;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }
        
        .alert-success i {
            color: #10b981;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .alert-custom .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        
        .alert-custom .close-btn:hover {
            color: #fff;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============================================
           LOGO
           ============================================ */
        
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-logo .logo-icon {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #6C3CE1, #9B59B6);
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: white;
            margin-bottom: 14px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.35);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .login-logo .logo-icon:hover {
            transform: scale(1.05) rotate(-3deg);
        }
        
        .login-logo h2 {
            font-weight: 800;
            font-size: 26px;
            margin: 0;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #8B5CF6, #D8B4FE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-logo p {
            color: #94a3b8;
            font-size: 14px;
            margin: 4px 0 0;
            font-weight: 400;
        }
        
        /* ============================================
           FORM
           ============================================ */
        
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
            display: block;
        }
        
        .form-label .required {
            color: #ef4444;
            margin-left: 2px;
        }
        
        .form-control {
            background: rgba(13, 21, 36, 0.8);
            border: 2px solid rgba(30, 41, 59, 0.5);
            color: #ffffff;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 15px;
            transition: all 0.3s ease;
            min-height: 52px;
            width: 100%;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .form-control:focus {
            background: rgba(13, 21, 36, 0.95);
            border-color: #6C3CE1;
            color: #ffffff;
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.12), 0 4px 20px rgba(108, 60, 225, 0.05);
            outline: none;
        }
        
        .form-control::placeholder {
            color: #64748b;
            font-size: 14px;
            font-weight: 400;
        }
        
        .form-control:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* ============================================
           BUTTONS
           ============================================ */
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #6C3CE1, #9B59B6);
            border: none;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 56px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 24px rgba(108, 60, 225, 0.3);
            cursor: pointer;
        }
        
        .btn-primary-custom:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.45);
        }
        
        .btn-primary-custom:active:not(:disabled) {
            transform: scale(0.97);
        }
        
        .btn-primary-custom:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-primary-custom .spinner-border {
            width: 20px;
            height: 20px;
            border-width: 2px;
        }
        
        .btn-success-custom {
            background: #10b981 !important;
            border: none;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            min-height: 56px;
            width: 100%;
            cursor: default;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        /* ============================================
           CHECKBOX
           ============================================ */
        
        .form-check {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-check-input {
            width: 18px;
            height: 18px;
            background: #0d1524;
            border: 2px solid #1e293b;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
        }
        
        .form-check-input:checked {
            background: #6C3CE1;
            border-color: #6C3CE1;
        }
        
        .form-check-label {
            font-size: 13px;
            color: #94a3b8;
            cursor: pointer;
        }
        
        #termsCheck {
            accent-color: #6C3CE1;
            cursor: pointer;
        }
        
        /* ============================================
           FOOTER
           ============================================ */
        
        .login-footer {
            text-align: center;
            margin-top: 24px;
        }
        
        .login-footer p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
        }
        
        .login-footer a {
            color: #8B5CF6;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .login-footer a:hover {
            color: #D8B4FE;
        }
        
        .login-footer .terms {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-top: 10px;
            line-height: 1.6;
        }
        
        .login-footer .terms a {
            color: #6C3CE1;
            font-weight: 500;
            font-size: 12px;
        }
        
        .login-footer .terms a:hover {
            color: #8B5CF6;
        }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        
        @media (max-width: 480px) {
            .signup-card {
                padding: 28px 18px;
                border-radius: 22px;
            }
            
            .login-logo .logo-icon {
                width: 64px;
                height: 64px;
                font-size: 28px;
                border-radius: 18px;
            }
            
            .login-logo h2 {
                font-size: 22px;
            }
            
            .form-control {
                padding: 12px 14px;
                min-height: 48px;
                font-size: 14px;
                border-radius: 12px;
            }
            
            .btn-primary-custom {
                font-size: 15px;
                padding: 14px 20px;
                min-height: 50px;
                border-radius: 12px;
            }
            
            .alert-custom {
                padding: 12px 14px;
                font-size: 13px;
                border-radius: 12px;
            }
        }
        
        @media (max-width: 360px) {
            .signup-card {
                padding: 20px 14px;
                border-radius: 18px;
            }
            
            .login-logo .logo-icon {
                width: 56px;
                height: 56px;
                font-size: 24px;
                border-radius: 16px;
            }
            
            .login-logo h2 {
                font-size: 20px;
            }
            
            .form-control {
                padding: 10px 12px;
                min-height: 44px;
                font-size: 13px;
            }
            
            .btn-primary-custom {
                font-size: 14px;
                padding: 12px 16px;
                min-height: 46px;
            }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="signup-card">
            
            <!-- ============================================
            LOGO
            ============================================ -->
            
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>Create Account</h2>
                <p>Join PaisaPay and start earning</p>
            </div>
            
             <!-- Alerts (Above Button) -->
                <div class="alert-container">
                    <div class="alert-custom alert-error" id="errorAlert">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="errorMessage">Invalid email or password</span>
                        <button class="close-btn" onclick="hideError()">✕</button>
                    </div>
                    <div class="alert-custom alert-success" id="successAlert">
                        <i class="fas fa-check-circle"></i>
                        <span id="successMessage">OTP sent successfully!</span>
                    </div>
                </div>

            <!-- ============================================
            SIGNUP FORM
            ============================================ -->
            
            <form id="signupForm" novalidate>
                
                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required autofocus>
                </div>
                
                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" class="form-control" id="emailInput" placeholder="your@email.com" required>
                </div>
                
                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Minimum 6 characters" required minlength="6">
                    <small class="text-secondary">Password must be at least 6 characters</small>
                </div>
                
                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="form-label">Confirm Password <span class="required">*</span></label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required minlength="6">
                    <small class="text-secondary" id="passwordMatchMsg"></small>
                </div>
                
                <!-- Referral Code -->
                <div class="mb-3">
                    <label class="form-label" id="referralLabel">Referral Code (Optional)</label>
                    <input type="text" class="form-control" id="referralCode" placeholder="Enter referral code">
                </div>
                
                <!-- Terms & Conditions -->
                <div class="mb-3" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="termsCheck" required style="width: 18px; height: 18px; accent-color: #6C3CE1; cursor: pointer; flex-shrink: 0;">
                    <label for="termsCheck" style="cursor: pointer; font-size: 14px; color: #94a3b8; margin: 0;">
                        I agree to the <a href="#" style="color: #8B5CF6; text-decoration: none; font-weight: 500;">Terms &amp; Conditions</a>
                    </label>
                </div>
                
               
                
                <!-- Submit Button -->
                <button type="submit" class="btn-primary-custom" id="signupBtn">
                    <i class="fas fa-user-plus me-2"></i>
                    <span id="btnText">Create Account</span>
                </button>
            </form>
            
            <!-- ============================================
            FOOTER
            ============================================ -->
            
            <div class="login-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
                <span class="terms">By continuing, you agree to our <a href="help.html">Terms &amp; Conditions</a> and <a href="help.html">Privacy Policy</a></span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ============================================
        // ✅ GET REFERRAL CODE FROM URL
        // ============================================
        
        function getReferralCode() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('ref');
        }

        // ============================================
        // ✅ AUTO-FILL & DISABLE REFERRAL FIELD
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            const referralCode = getReferralCode();
            const referralInput = document.getElementById('referralCode');
            const referralLabel = document.getElementById('referralLabel');
            
            if (referralCode && referralInput) {
                referralInput.value = referralCode;
                referralInput.disabled = true;
                referralInput.classList.add('bg-secondary', 'opacity-75');
                
                if (referralLabel) {
                    referralLabel.innerHTML = 'Referral Code <span class="text-success">(Applied)</span>';
                }
                
                const helpText = document.createElement('small');
                helpText.className = 'text-secondary d-block mt-1';
                helpText.textContent = 'ℹ️ Will be verified on signup';
                referralInput.parentNode.appendChild(helpText);
                console.log('✅ Referral code auto-filled & locked: ' + referralCode);
            }
        });

        // ============================================
        // ✅ DOM ELEMENTS
        // ============================================
        
        const signupForm = document.getElementById('signupForm');
        const fullName = document.getElementById('fullName');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const confirmPassword = document.getElementById('confirmPassword');
        const referralCode = document.getElementById('referralCode');
        const termsCheck = document.getElementById('termsCheck');
        const signupBtn = document.getElementById('signupBtn');
        const btnText = document.getElementById('btnText');
        
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const successAlert = document.getElementById('successAlert');
        const successMessage = document.getElementById('successMessage');
        const passwordMatchMsg = document.getElementById('passwordMatchMsg');
        
        // ============================================
        // ✅ PASSWORD MATCH CHECK
        // ============================================
        
        confirmPassword.addEventListener('input', function() {
            if (this.value.length > 0) {
                if (this.value === passwordInput.value) {
                    passwordMatchMsg.textContent = '✅ Passwords match';
                    passwordMatchMsg.style.color = '#10b981';
                } else {
                    passwordMatchMsg.textContent = '❌ Passwords do not match';
                    passwordMatchMsg.style.color = '#ef4444';
                }
            } else {
                passwordMatchMsg.textContent = '';
            }
        });

        passwordInput.addEventListener('input', function() {
            if (confirmPassword.value.length > 0) {
                if (this.value === confirmPassword.value) {
                    passwordMatchMsg.textContent = '✅ Passwords match';
                    passwordMatchMsg.style.color = '#10b981';
                } else {
                    passwordMatchMsg.textContent = '❌ Passwords do not match';
                    passwordMatchMsg.style.color = '#ef4444';
                }
            }
        });
        
        // ============================================
        // ✅ TOAST FUNCTION
        // ============================================
        
        function showToast(message, type = 'info') {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            
            const colors = {
                success: 'bg-success',
                error: 'bg-danger',
                warning: 'bg-warning',
                info: 'bg-info'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white ${colors[type]} border-0`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            
            container.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast, { delay: 5000 });
            bsToast.show();
        }
        
        // ============================================
        // ✅ ALERT FUNCTIONS
        // ============================================
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorAlert.classList.add('show');
            successAlert.classList.remove('show');
            clearTimeout(window.errorTimeout);
            window.errorTimeout = setTimeout(hideError, 5000);
        }
        
        function hideError() {
            errorAlert.classList.remove('show');
        }
        
        function showSuccess(msg) {
            successMessage.textContent = msg;
            successAlert.classList.add('show');
            errorAlert.classList.remove('show');
            clearTimeout(window.successTimeout);
            window.successTimeout = setTimeout(() => {
                successAlert.classList.remove('show');
            }, 3000);
        }
        
        // ============================================
        // ✅ SIGNUP HANDLER
        // ============================================

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            successAlert.classList.remove('show');
            
            const name = fullName.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const confirm = confirmPassword.value.trim();
            const referral = referralCode.value.trim();
            
            // Validate fields
            if (!name || !email || !password || !confirm) {
                showError('⚠️ Please fill in all required fields');
                return;
            }
            
            if (password.length < 6) {
                showError('⚠️ Password must be at least 6 characters');
                return;
            }
            
            // ✅ CHECK PASSWORD MATCH
            if (password !== confirm) {
                showError('⚠️ Passwords do not match');
                confirmPassword.focus();
                return;
            }
            
            // ✅ CHECK TERMS
            if (!termsCheck.checked) {
                showError('⚠️ Please agree to the Terms & Conditions');
                termsCheck.focus();
                return;
            }
            
            try {
                signupBtn.disabled = true;
                btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';
                
                const response = await fetch('https://paisa-pay.online/api/auth/signup.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: name,
                        email: email,
                        password: password,
                        referral_code: referral || ''
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // ✅ SHOW SUCCESS TOAST WITH CLEAR NEXT STEPS
                    let message = '✅ Account created! Please check your email to verify your account.';
                    
                    if (data.referral && data.referral.recorded) {
                        message = '✅ Account created! Check your email for verification link. Referral bonus will be credited after verification.';
                    }
                    
                    showToast(message, 'success');
                    
                    // ✅ SHOW VERIFICATION REMINDER
                    setTimeout(() => {
                        showToast('📧 Verification email sent to ' + email, 'info');
                    }, 1500);
                    
                    // ✅ Save email for reference
                    localStorage.setItem('temp_user_email', email);
                    
                    // ✅ Disable form and show waiting state
                    signupBtn.disabled = true;
                    btnText.innerHTML = '✅ Check Your Email';
                    signupBtn.className = 'btn-success-custom';
                    
                    // ✅ Redirect after 5 seconds with clear message
                    setTimeout(() => {
                        window.location.href = '/login.html?email=' + encodeURIComponent(email) + '&verified=false';
                    }, 5000);
                    
                } else {
                    showError(data.message || 'Signup failed');
                    signupBtn.disabled = false;
                    btnText.innerHTML = '<i class="fas fa-user-plus me-2"></i>Create Account';
                    signupBtn.className = 'btn-primary-custom';
                }
                
            } catch (error) {
                console.error('❌ Signup error:', error);
                signupBtn.disabled = false;
                btnText.innerHTML = '<i class="fas fa-user-plus me-2"></i>Create Account';
                signupBtn.className = 'btn-primary-custom';
                showError('Connection error. Please try again.');
            }
        });

        // ============================================
        // ✅ ENTER KEY
        // ============================================
        
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                signupForm.dispatchEvent(new Event('submit'));
            }
        });
        
        // ============================================
        // ✅ CHECK LOGIN
        // ============================================
        
        if (localStorage.getItem('auth_token')) {
            window.location.href = '/dashboard.html';
        }
        
        console.log('✅ Signup page ready');
    </script>

</body>
</html>
