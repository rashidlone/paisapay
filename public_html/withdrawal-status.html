<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdrawal Status - PaisaPay</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    
    <style>
        body {
            padding-top: 56px !important;
            padding-bottom: 70px !important;
            background: #0a0e1a;
            font-family: 'Inter', sans-serif;
        }
        
        .status-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .status-badge.under_review { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .status-badge.approved { background: rgba(52,211,153,0.15); color: #34d399; }
        .status-badge.rejected { background: rgba(248,113,113,0.15); color: #f87171; }
        .status-badge.paid { background: rgba(52,211,153,0.15); color: #34d399; }
        
        .requirement-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a2234;
        }
        .requirement-item:last-child { border-bottom: none; }
        .requirement-item .label { color: #94a3b8; font-size: 13px; }
        .requirement-item .value { font-weight: 600; font-size: 13px; }
        .requirement-item .value.met { color: #34d399; }
        .requirement-item .value.unmet { color: #f87171; }
        
        .timeline {
            position: relative;
            padding-left: 24px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #1a2234;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -18px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a3a4a;
            border: 2px solid #1a2234;
        }
        .timeline-item.active::before {
            background: #6C3CE1;
            border-color: #6C3CE1;
            box-shadow: 0 0 12px rgba(108,60,225,0.3);
        }
        .timeline-item.completed::before {
            background: #34d399;
            border-color: #34d399;
        }
        .timeline-item .title { color: #ffffff; font-weight: 600; font-size: 14px; }
        .timeline-item .desc { color: #94a3b8; font-size: 12px; }
        .timeline-item .time { color: #64748b; font-size: 11px; }
        
        .bottom-nav {
            background: #111827 !important;
            border-top: 1px solid #1e293b;
            padding: 4px 0 env(safe-area-inset-bottom);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .bottom-nav .nav-link {
            color: #64748b !important;
            text-align: center;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 500;
            min-width: 48px;
            text-decoration: none;
        }
        .bottom-nav .nav-link i {
            font-size: 20px;
            display: block;
            margin-bottom: 1px;
        }
        .bottom-nav .nav-link.active {
            color: #8B5CF6 !important;
        }
        .bottom-nav .nav-link.active i {
            color: #8B5CF6 !important;
        }
        
        .btn-back {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 0;
            transition: color 0.2s;
        }
        .btn-back:hover { color: #ffffff; }
    </style>
</head>
<body>

    <iframe 
        src="/includes/nav.html" 
        style="width:100%; height:56px; border:none; position:fixed; top:0; left:0; z-index:1000; background:transparent !important; overflow:visible;"
        scrolling="no"
        id="navIframe"
        allowtransparency="true">
    </iframe>

    <script>
        window.addEventListener('message', function(event) {
            var iframe = document.getElementById('navIframe');
            if (!iframe) return;
            if (event.data && event.data.type === 'expandNav') {
                iframe.style.height = '400px';
                iframe.style.background = 'transparent';
            } else if (event.data && event.data.type === 'collapseNav') {
                iframe.style.height = '56px';
                iframe.style.background = 'transparent';
            }
        });
    </script>

    <div class="container mt-3 mt-md-4 pb-5">
        
        <div class="d-flex align-items-center gap-3 mb-4">
            <button class="btn-back" onclick="history.back()">
                <i class="fas fa-arrow-left fa-lg"></i>
            </button>
            <h5 class="text-white mb-0"><i class="fas fa-clock me-2" style="color: #fbbf24;"></i>Withdrawal Status</h5>
        </div>

        <div id="statusContent">
            <!-- Loading -->
            <div class="text-center py-4">
                <div class="spinner-border text-primary"></div>
                <p class="text-secondary mt-2">Loading withdrawal status...</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="container d-flex justify-content-around">
            <a href="dashboard.html" class="nav-link" data-page="home">
                <i class="fas fa-home"></i><span>Home</span>
            </a>
            <a href="earn.html" class="nav-link" data-page="earn">
                <i class="fas fa-tasks"></i><span>Earn</span>
            </a>
            <a href="leaderboard.html" class="nav-link" data-page="leaderboard">
                <i class="fas fa-trophy"></i><span>Rank</span>
            </a>
            <a href="invite.html" class="nav-link" data-page="invite">
                <i class="fas fa-user-plus"></i><span>Invite</span>
            </a>
            <a href="profile.html" class="nav-link active" data-page="profile">
                <i class="fas fa-user"></i><span>Profile</span>
            </a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.replace('/login.html');
        }

        const API_BASE = '/api';
        const WITHDRAWAL_STATUS = `${API_BASE}/withdraw/status.php`;
        const WITHDRAWAL_HISTORY = `${API_BASE}/withdraw/history.php`;

        async function loadWithdrawalStatus() {
            try {
                const response = await fetch(WITHDRAWAL_STATUS, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.status === 401) {
                    localStorage.removeItem('auth_token');
                    window.location.replace('/login.html');
                    return;
                }

                const result = await response.json();
                
                if (result.success) {
                    renderStatus(result.data);
                } else {
                    document.getElementById('statusContent').innerHTML = `
                        <div class="status-card text-center">
                            <i class="fas fa-inbox fa-3x text-secondary mb-3"></i>
                            <h6 class="text-white">No Withdrawal History</h6>
                            <p class="text-secondary">You haven't made any withdrawal requests yet.</p>
                            <a href="withdraw.html" class="btn btn-primary btn-sm">Request Withdrawal</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderStatus(data) {
            const container = document.getElementById('statusContent');
            
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="status-card text-center">
                        <i class="fas fa-inbox fa-3x text-secondary mb-3"></i>
                        <h6 class="text-white">No Withdrawal History</h6>
                        <p class="text-secondary">You haven't made any withdrawal requests yet.</p>
                        <a href="withdraw.html" class="btn btn-primary btn-sm">Request Withdrawal</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="status-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h6 class="text-white mb-0">₹${Math.round(item.amount).toLocaleString()}</h6>
                            <small class="text-secondary">#${item.id} · ${new Date(item.created_at).toLocaleDateString()}</small>
                        </div>
                        <span class="status-badge ${item.status}">${item.status.replace('_', ' ').toUpperCase()}</span>
                    </div>
                    
                    ${item.status === 'under_review' || item.status === 'pending' ? `
                        <div class="mb-3">
                            <small class="text-secondary">🔍 Your request is being reviewed. This usually takes 24-48 hours.</small>
                        </div>
                    ` : ''}
                    
                    ${item.status === 'rejected' ? `
                        <div class="mb-3">
                            <small class="text-danger">❌ ${item.admin_notes || 'Request rejected. Please contact support.'}</small>
                        </div>
                    ` : ''}
                    
                    ${item.requirements ? `
                        <div class="mt-3 pt-3 border-top border-secondary">
                            <small class="text-secondary">Requirements Check</small>
                            ${Object.entries(item.requirements.details || {}).map(([key, req]) => `
                                <div class="requirement-item">
                                    <span class="label">${key.replace('_', ' ').toUpperCase()}</span>
                                    <span class="value ${req.met ? 'met' : 'unmet'}">
                                        ${req.current} / ${req.required || req.min || req.max}
                                        ${req.met ? '✅' : '❌'}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        loadWithdrawalStatus();
        console.log('✅ Withdrawal Status page loaded');
    </script>

</body>
</html>
