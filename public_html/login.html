<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - PaisaPay</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           LOGIN PAGE STYLES
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(108, 60, 225, 0.08), transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(155, 89, 182, 0.05), transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        
        .login-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .login-card {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6C3CE1, #9B59B6, #6C3CE1);
            background-size: 200% 100%;
            animation: shimmerBorder 3s ease-in-out infinite;
        }
        
        @keyframes shimmerBorder {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* ============================================
           TOAST STYLES
           ============================================ */
        
        .toast-container {
            z-index: 99999 !important;
            top: 70px !important;
        }
        
        .toast {
            background: #111827 !important;
            border: 1px solid #1e293b !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
        }
        
        .toast .toast-body {
            font-size: 14px;
            font-weight: 500;
            padding: 12px 16px;
        }
        
        .toast.bg-success .toast-body { color: #10b981; }
        .toast.bg-danger .toast-body { color: #f87171; }
        .toast.bg-warning .toast-body { color: #fbbf24; }
        .toast.bg-info .toast-body { color: #60a5fa; }
        
        @media (max-width: 480px) {
            .toast-container {
                top: 60px !important;
                right: 10px;
                left: 10px;
            }
            .toast {
                width: 100% !important;
                max-width: 100% !important;
            }
        }
        
        /* ============================================
           ALERTS - TOP OF CARD
           ============================================ */
        
        .alert-container {
            margin-bottom: 20px;
        }
        
        .alert-custom {
            display: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.3s ease-out;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .alert-custom.show {
            display: flex;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        
        .alert-error i {
            color: #ef4444;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }
        
        .alert-success i {
            color: #10b981;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .alert-custom .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        
        .alert-custom .close-btn:hover {
            color: #fff;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============================================
           LOGO
           ============================================ */
        
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-logo .logo-icon {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #6C3CE1, #9B59B6);
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: white;
            margin-bottom: 14px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.35);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .login-logo .logo-icon:hover {
            transform: scale(1.05) rotate(-3deg);
        }
        
        .login-logo h2 {
            font-weight: 800;
            font-size: 26px;
            margin: 0;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #8B5CF6, #D8B4FE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-logo p {
            color: #94a3b8;
            font-size: 14px;
            margin: 4px 0 0;
            font-weight: 400;
        }
        
        /* ============================================
           FORM
           ============================================ */
        
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
            display: block;
        }
        
        .form-label .required {
            color: #ef4444;
            margin-left: 2px;
        }
        
        .form-control {
            background: rgba(13, 21, 36, 0.8);
            border: 2px solid rgba(30, 41, 59, 0.5);
            color: #ffffff;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 15px;
            transition: all 0.3s ease;
            min-height: 52px;
            width: 100%;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .form-control:focus {
            background: rgba(13, 21, 36, 0.95);
            border-color: #6C3CE1;
            color: #ffffff;
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.12), 0 4px 20px rgba(108, 60, 225, 0.05);
            outline: none;
        }
        
        .form-control::placeholder {
            color: #64748b;
            font-size: 14px;
            font-weight: 400;
        }
        
        /* ============================================
           BUTTONS
           ============================================ */
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #6C3CE1, #9B59B6);
            border: none;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 56px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 24px rgba(108, 60, 225, 0.3);
            cursor: pointer;
        }
        
        .btn-primary-custom:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.45);
        }
        
        .btn-primary-custom:active:not(:disabled) {
            transform: scale(0.97);
        }
        
        .btn-primary-custom:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-primary-custom .spinner-border {
            width: 20px;
            height: 20px;
            border-width: 2px;
        }
        
        /* ============================================
           DIVIDER
           ============================================ */
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            gap: 16px;
        }
        
        .divider .line {
            flex: 1;
            height: 1px;
            background: rgba(30, 41, 59, 0.5);
        }
        
        .divider .text {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        
        /* ============================================
           FOOTER
           ============================================ */
        
        .login-footer {
            text-align: center;
            margin-top: 24px;
        }
        
        .login-footer p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
        }
        
        .login-footer a {
            color: #8B5CF6;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .login-footer a:hover {
            color: #D8B4FE;
        }
        
        .login-footer .terms {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-top: 10px;
            line-height: 1.6;
        }
        
        .login-footer .terms a {
            color: #6C3CE1;
            font-weight: 500;
            font-size: 12px;
        }
        
        .login-footer .terms a:hover {
            color: #8B5CF6;
        }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 18px;
                border-radius: 22px;
            }
            
            .login-logo .logo-icon {
                width: 64px;
                height: 64px;
                font-size: 28px;
                border-radius: 18px;
            }
            
            .login-logo h2 {
                font-size: 22px;
            }
            
            .form-control {
                padding: 12px 14px;
                min-height: 48px;
                font-size: 14px;
                border-radius: 12px;
            }
            
            .btn-primary-custom {
                font-size: 15px;
                padding: 14px 20px;
                min-height: 50px;
                border-radius: 12px;
            }
            
            .alert-custom {
                padding: 12px 14px;
                font-size: 13px;
                border-radius: 12px;
            }
        }
        
        @media (max-width: 360px) {
            .login-card {
                padding: 20px 14px;
                border-radius: 18px;
            }
            
            .login-logo .logo-icon {
                width: 56px;
                height: 56px;
                font-size: 24px;
                border-radius: 16px;
            }
            
            .login-logo h2 {
                font-size: 20px;
            }
            
            .form-control {
                padding: 10px 12px;
                min-height: 44px;
                font-size: 13px;
            }
            
            .btn-primary-custom {
                font-size: 14px;
                padding: 12px 16px;
                min-height: 46px;
            }
        }
        
        .forgot-link {
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
            float: right;
            margin-top: 6px;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        
        .forgot-link:hover {
            color: #8B5CF6;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <!-- ============================================
            ALERTS - TOP OF CARD
            ============================================ -->
            
            <div class="alert-container">
                <div class="alert-custom alert-error" id="errorAlert">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorMessage">Invalid email or password</span>
                    <button class="close-btn" onclick="hideError()">✕</button>
                </div>
                
                <div class="alert-custom alert-success" id="successAlert">
                    <i class="fas fa-check-circle"></i>
                    <span id="successMessage">OTP sent successfully!</span>
                </div>
            </div>
            
            <!-- ============================================
            LOGO
            ============================================ -->
            
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <h2>PaisaPay</h2>
                <p>Welcome back! Login to your account</p>
            </div>

            <!-- ============================================
            LOGIN FORM
            ============================================ -->
            
            <form id="loginForm" novalidate>
                
                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" class="form-control" id="emailInput" placeholder="your@email.com" required autofocus>
                </div>
                
                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Enter your password" required>
                    <span class="forgot-link" onclick="forgotPassword()">Forgot password?</span>
                </div><br>
                
                <!-- Submit Button -->
                <button type="submit" class="btn-primary-custom" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    <span id="btnText">Sign In</span>
                </button>
            </form>
            
            <!-- ============================================
            DIVIDER & FOOTER
            ============================================ -->
            
            <div class="divider">
                <span class="line"></span>
                <span class="text">Secure Access</span>
                <span class="line"></span>
            </div>
            
            <div class="login-footer">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                <span class="terms">
                    By continuing, you agree to our <a href="help.html">Terms &amp; Conditions</a> and <a href="help.html">Privacy Policy</a>
                </span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // ============================================
        // ✅ CHECK IF ALREADY LOGGED IN
        // ============================================
        
        const token = localStorage.getItem('auth_token');
        const userData = localStorage.getItem('user_data');
        
        if (token && userData) {
            fetch('https://paisa-pay.online/api/auth/validate.php', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.valid) {
                    window.location.replace('/dashboard.html');
                } else {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_data');
                }
            })
            .catch(() => {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_data');
            });
        }
        
        // ============================================
        // ✅ CHECK FOR VERIFICATION MESSAGE
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            const verified = urlParams.get('verified');
            
            if (email && verified === 'false') {
                showToast('📧 Please check your email (' + email + ') to verify your account before logging in.', 'info');
                window.history.replaceState({}, document.title, '/login.html');
            }
            
            if (verified === 'true') {
                showToast('✅ Email verified! You can now login.', 'success');
                window.history.replaceState({}, document.title, '/login.html');
            }
        });
        
        console.log('✅ Login page loaded');
        
        // ============================================
        // ✅ DOM ELEMENTS
        // ============================================
        
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const successAlert = document.getElementById('successAlert');
        const successMessage = document.getElementById('successMessage');
        
        // ============================================
        // ✅ TOAST FUNCTION
        // ============================================
        
        function showToast(message, type = 'info') {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            
            const colors = {
                success: 'bg-success',
                error: 'bg-danger',
                warning: 'bg-warning',
                info: 'bg-info'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white ${colors[type]} border-0`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container position-fixed top-0 end-0 p-3';
                document.body.appendChild(container);
            }
            
            container.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast, { delay: 5000 });
            bsToast.show();
        }
        
        // ============================================
        // ✅ ALERT FUNCTIONS
        // ============================================
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorAlert.classList.add('show');
            successAlert.classList.remove('show');
            clearTimeout(window.errorTimeout);
            window.errorTimeout = setTimeout(hideError, 5000);
        }
        
        function hideError() {
            errorAlert.classList.remove('show');
        }
        
        function showSuccess(msg) {
            successMessage.textContent = msg;
            successAlert.classList.add('show');
            errorAlert.classList.remove('show');
            clearTimeout(window.successTimeout);
            window.successTimeout = setTimeout(() => {
                successAlert.classList.remove('show');
            }, 3000);
        }
        
        // ============================================
        // ✅ LOGIN HANDLER
        // ============================================
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            successAlert.classList.remove('show');
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }
            
            try {
                loginBtn.disabled = true;
                btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
                
                const response = await fetch('https://paisa-pay.online/api/auth/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    
                    showSuccess('✅ Login successful! Redirecting...');
                    
                    setTimeout(() => {
                        window.location.replace('/dashboard.html');
                    }, 1000);
                } else {
                    showError(data.message || 'Login failed');
                    loginBtn.disabled = false;
                    btnText.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
                }
                
            } catch (error) {
                console.error('Login error:', error);
                loginBtn.disabled = false;
                btnText.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
                showError('Connection error. Please try again.');
            }
        });
        
        // ============================================
        // ✅ FORGOT PASSWORD
        // ============================================
        
        async function forgotPassword() {
            const email = emailInput.value.trim();
            
            if (!email) {
                showError('Please enter your email address first');
                emailInput.focus();
                return;
            }
            
            try {
                const response = await fetch('https://paisa-pay.online/api/auth/forgot-password.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('✅ Password reset link sent to your email!');
                } else {
                    showError(data.message || 'Failed to send reset link');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
            }
        }
        
        // ============================================
        // ✅ ENTER KEY SUPPORT
        // ============================================
        
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
        
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });
        
        console.log('✅ Login page ready');
    </script>

</body>
</html>
