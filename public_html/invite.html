<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invite & Earn - PaisaPay</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
    
    .toast-container { z-index: 99999 !important; top: 70px !important; }
        .stat-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s ease;
            height: 100%;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(108,60,225,0.3);
        }
        .stat-card .number {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #6C3CE1, #9B59B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .label {
            font-size: 12px;
            color: #94a3b8;
        }
        .stat-card .icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .share-card {
            background: linear-gradient(135deg, rgba(108,60,225,0.1), rgba(155,89,182,0.05));
            border: 1px solid rgba(108,60,225,0.2);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .share-card .big-icon {
            font-size: 48px;
            color: #8B5CF6;
            margin-bottom: 12px;
        }
        .share-card .referral-code-box {
            background: rgba(13,21,36,0.8);
            border: 2px solid #1e293b;
            border-radius: 10px;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #8B5CF6;
            word-break: break-all;
        }
        .share-card .referral-link-box {
            background: rgba(13,21,36,0.8);
            border: 2px solid #1e293b;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #94a3b8;
            word-break: break-all;
        }
        
        .share-btn {
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            border: none;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .share-btn:hover {
            transform: translateY(-2px);
        }
        .share-btn.whatsapp { background: #25D366; }
        .share-btn.telegram { background: #0088cc; }
        .share-btn.facebook { background: #1877F2; }
        .share-btn.copy { background: #6C3CE1; }
        .share-btn.copy:hover { background: #5A2FC7; }
        
        .referral-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1a2234;
            gap: 10px;
        }
        .referral-item:last-child { border-bottom: none; }
        .referral-item .info { flex: 1; min-width: 0; }
        .referral-item .info .name { font-weight: 500; font-size: 14px; }
        .referral-item .info .date { font-size: 11px; color: #64748b; }
        .referral-item .reward { font-weight: 700; color: #10b981; font-size: 14px; white-space: nowrap; }
        .referral-item .status {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .referral-item .status.pending { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .referral-item .status.rewarded { background: rgba(16,185,129,0.15); color: #10b981; }
        
        .bottom-nav {
            background: #111827 !important;
            border-top: 1px solid #1e293b;
            padding: 4px 0 env(safe-area-inset-bottom);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1050;
        }
        .bottom-nav .nav-link {
            color: #64748b !important;
            text-align: center;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 500;
            min-width: 48px;
            text-decoration: none;
        }
        .bottom-nav .nav-link i {
            font-size: 20px;
            display: block;
            margin-bottom: 1px;
        }
        .bottom-nav .nav-link.active {
            color: #8B5CF6 !important;
        }
        .bottom-nav .nav-link.active i {
            color: #8B5CF6 !important;
        }
        
        @media (max-width: 480px) {
            .stat-card .number { font-size: 20px; }
            .share-card .referral-code-box { font-size: 16px; padding: 10px 12px; }
            .share-card .referral-link-box { font-size: 12px; }
            .share-btn { font-size: 13px; padding: 10px 16px; }
        }
    </style>
</head>
<body>

     <!-- ============================================
    ✅ TOP NAVIGATION - Independent
    ============================================ -->
    
     <iframe 
    src="/includes/nav.html" 
    style="width:100%; height:56px; border:none; position:fixed; top:0; left:0; z-index:1000; background:transparent !important; overflow:visible;"
    scrolling="no"
    id="navIframe"
    allowtransparency="true"
></iframe>

<script>
    window.addEventListener('message', function(event) {
        var iframe = document.getElementById('navIframe');
        if (!iframe) return;
        
        if (event.data && event.data.type === 'expandNav') {
            iframe.style.height = '400px';  // ✅ Increased from 300px to 400px
            iframe.style.background = 'transparent';
        } else if (event.data && event.data.type === 'collapseNav') {
            iframe.style.height = '56px';
            iframe.style.background = 'transparent';
        }
    });
</script>

    <!-- ============================================
    MAIN CONTENT
    ============================================ -->
    
    <div class="container mt-5 pt-4 pb-5">
        
        <!-- Stats -->
        <div class="row g-2 g-md-3 mb-4">
            <div class="col-6">
                <div class="stat-card">
                    <div class="icon"><i class="fas fa-users text-success"></i></div>
                    <div class="number" id="totalReferrals">0</div>
                    <div class="label">Total Referrals</div>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-card">
                    <div class="icon"><i class="fas fa-coins text-warning"></i></div>
                    <div class="number" id="referralEarnings">₹0</div>
                    <div class="label">Referral Earnings</div>
                </div>
            </div>
        </div>

        <!-- Share Card -->
        <div class="share-card mb-4">
            <div class="big-icon">
                <i class="fas fa-share-alt"></i>
            </div>
            <h5 class="text-white">Invite Friends & Earn ₹100 Each!</h5>
            <p class="text-secondary small">Share your referral link and earn rewards when friends join</p>
            
            <!-- Referral Code -->
            <div class="mb-3">
                <label class="text-secondary small">Your Referral Code</label>
                <div class="referral-code-box" id="referralCodeDisplay">LOADING...</div>
            </div>
            
            <!-- Referral Link -->
            <div class="mb-3">
                <label class="text-secondary small">Your Referral Link</label>
                <div class="referral-link-box" id="referralLinkDisplay">Loading...</div>
            </div>
            
            <!-- Share Buttons -->
            <div class="row g-2">
                <div class="col-6 col-md-3">
                    <button class="share-btn copy" onclick="copyReferralLink()">
                        <i class="fas fa-copy"></i> Copy Link
                    </button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="share-btn whatsapp" onclick="shareWhatsApp()">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="share-btn telegram" onclick="shareTelegram()">
                        <i class="fab fa-telegram"></i> Telegram
                    </button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="share-btn facebook" onclick="shareFacebook()">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>
            </div>
        </div>

        <!-- Referral History -->
        <h5 class="text-white mb-3"><i class="fas fa-history me-2"></i>Referral History</h5>
        <div class="card bg-dark text-white border-secondary" id="referralHistory">
            <div class="card-body text-center text-secondary py-4">
                <i class="fas fa-inbox fa-3x text-secondary mb-2"></i>
                <p class="mb-0">No referrals yet. Share your link!</p>
            </div>
        </div>
    </div>

    <!-- ============================================
    BOTTOM NAVIGATION - FIXED
    ============================================ -->
    
    <nav class="bottom-nav">
        <div class="container d-flex justify-content-around">
            <a href="dashboard.html" class="nav-link" data-page="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="earn.html" class="nav-link" data-page="earn">
                <i class="fas fa-tasks"></i>
                <span>Earn</span>
            </a>
            <a href="leaderboard.html" class="nav-link" data-page="leaderboard">
                <i class="fas fa-trophy"></i>
                <span>Rank</span>
            </a>
            <a href="invite.html" class="nav-link active" data-page="invite">
                <i class="fas fa-user-plus"></i>
                <span>Invite</span>
            </a>
            <a href="withdraw.html" class="nav-link" data-page="withdraw">
                <i class="fas fa-money-bill-wave"></i>
                <span>Withdraw</span>
            </a>
        </div>
    </nav>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ============================================
        // ✅ AUTH CHECK - NO REDIRECT LOOP
        // ============================================
        
        const token = localStorage.getItem('auth_token');
        const userData = localStorage.getItem('user_data');
        
        if (!token || !userData) {
            window.location.replace('/login.html');
        }
        
        console.log('✅ User authenticated, loading invite page');
        
        // ============================================
        // ✅ STATE
        // ============================================
        
        let referralData = null;
        let userReferralCode = '';
        let userFullName = '';
        
        try {
            const user = JSON.parse(userData);
            userReferralCode = user.referral_code || '';
            userFullName = user.full_name || 'User';
            // Update wallet balance
            const balance = parseFloat(user.wallet_balance || 0);
            document.getElementById('walletBalance').textContent = '₹' + balance.toFixed(2);
        } catch (e) {
            console.error('Error parsing user data:', e);
        }
        
        // ============================================
        // ✅ LOAD REFERRAL DATA
        // ============================================
        
        async function loadReferralData() {
            try {
                const response = await fetch('https://paisa-pay.online/api/referrals/list.php', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_data');
                    window.location.replace('/login.html');
                    return;
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    showToast(data.message || 'Error loading referral data', 'error');
                    return;
                }
                
                referralData = data.data;
                
                // Update stats
                document.getElementById('totalReferrals').textContent = referralData.total || 0;
                document.getElementById('referralEarnings').textContent = '₹' + (referralData.earnings || 0);
                
                // Update referral code and link
                if (userReferralCode) {
                    document.getElementById('referralCodeDisplay').textContent = userReferralCode;
                    const baseUrl = window.location.origin;
                    const referralLink = `${baseUrl}/?ref=${userReferralCode}`;
                    document.getElementById('referralLinkDisplay').textContent = referralLink;
                }
                
                // Render referral history
                renderReferralHistory(referralData.history || []);
                
            } catch (error) {
                console.error('Load referral error:', error);
                showToast('Error loading referral data', 'error');
            }
        }
        
        // ============================================
        // ✅ RENDER REFERRAL HISTORY
        // ============================================
        
        // In invite.html - Replace the renderReferralHistory function

function renderReferralHistory(history) {
    const container = document.getElementById('referralHistory');
    
    if (!history || history.length === 0) {
        container.innerHTML = `
            <div class="card-body text-center text-secondary py-4">
                <i class="fas fa-inbox fa-3x text-secondary mb-2"></i>
                <p class="mb-0">No referrals yet. Share your link!</p>
            </div>
        `;
        return;
    }
    
    let html = '<div class="card-body p-0">';
    
    history.forEach(item => {
        // ✅ Determine status based on verification and reward
        let statusClass = 'pending';
        let statusText = '⏳ Pending';
        let statusIcon = '📝';
        
        if (item.is_rewarded) {
            statusClass = 'rewarded';
            statusText = '✅ Rewarded';
            statusIcon = '💰';
        } else if (item.validation_status === 'verified') {
            statusClass = 'pending';
            statusText = '⏳ Waiting for verification';
            statusIcon = '📧';
        } else if (item.validation_status === 'pending') {
            statusText = '⏳ Email not verified';
            statusIcon = '📧';
        }
        
        const date = new Date(item.created_at).toLocaleDateString();
        const name = item.referred_user_name || 'User';
        
        html += `
            <div class="referral-item px-3">
                <div class="info">
                    <div class="name">${name}</div>
                    <div class="date">${date}</div>
                </div>
                <div>
                    <span class="status ${statusClass}">${statusIcon} ${statusText}</span>
                </div>
                <div class="reward">${item.is_rewarded ? '+₹' + (item.reward_amount || 0) : '⏳'}</div>
            </div>
        `;
    });
    
    html += '</div>';
    container.innerHTML = html;
}
        
        // ============================================
        // ✅ SHARE FUNCTIONS
        // ============================================
        
        function getReferralLink() {
            const linkElement = document.getElementById('referralLinkDisplay');
            return linkElement.textContent || '';
        }
        
        function getShareMessage() {
            const link = getReferralLink();
            const name = userFullName || 'User';
            return `🎉 Join PaisaPay and earn rewards! Use my referral link: ${link}`;
        }
        
        // ============================================
        // ✅ COPY REFERRAL LINK
        // ============================================
        
        window.copyReferralLink = function() {
            const link = getReferralLink();
            if (!link || link === 'Loading...') {
                showToast('Referral link not ready yet', 'warning');
                return;
            }
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => {
                    showToast('✅ Referral link copied!', 'success');
                }).catch(() => {
                    fallbackCopy(link);
                });
            } else {
                fallbackCopy(link);
            }
        };
        
        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast('✅ Referral link copied!', 'success');
        }
        
        // ============================================
        // ✅ SHARE ON WHATSAPP
        // ============================================
        
        window.shareWhatsApp = function() {
            const message = getShareMessage();
            const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        };
        
        // ============================================
        // ✅ SHARE ON TELEGRAM
        // ============================================
        
        window.shareTelegram = function() {
            const link = getReferralLink();
            const message = getShareMessage();
            const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        };
        
        // ============================================
        // ✅ SHARE ON FACEBOOK
        // ============================================
        
        window.shareFacebook = function() {
            const link = getReferralLink();
            const url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`;
            window.open(url, '_blank');
        };
        
        // ============================================
        // ✅ TOAST
        // ============================================
        
        function showToast(message, type = 'info') {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            
            const colors = {
                success: 'bg-success',
                error: 'bg-danger',
                warning: 'bg-warning',
                info: 'bg-info'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white ${colors[type]} border-0`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container position-fixed top-0 end-0 p-3';
                document.body.appendChild(container);
            }
            
            container.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast, { delay: 3000 });
            bsToast.show();
        }
        
        // ============================================
        // ✅ LOAD ON PAGE LOAD
        // ============================================
        
        loadReferralData();
        
        // Refresh every 30 seconds
        setInterval(() => {
            if (!document.hidden) {
                loadReferralData();
            }
        }, 30000);
        
        console.log('✅ Invite page loaded successfully');
    </script>

</body>
</html>
