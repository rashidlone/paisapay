name: Generate Code Markdown

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Delete old public_html and CODE.md
        run: |
          echo "Deleting old public_html..."
          rm -rf public_html

          echo "Deleting old CODE.md..."
          rm -f CODE.md

      - name: Extract public_html.zip
        run: |
          if [ ! -f "public_html.zip" ]; then
            echo "ERROR: public_html.zip not found!"
            exit 1
          fi

          echo "Extracting public_html.zip..."
          mkdir -p public_html
          unzip -o public_html.zip -d public_html

          # Remove vendor completely
          rm -rf public_html/vendor

          echo "Extraction completed."

      - name: Generate CODE.md
        shell: bash
        run: |
          echo "# Paisapay Source Code" > CODE.md
          echo "" >> CODE.md
          echo "Complete source code of the project." >> CODE.md
          echo "" >> CODE.md
          echo "---" >> CODE.md
          echo "" >> CODE.md

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./vendor/*" \
            ! -path "*/vendor/*" \
            ! -path "./node_modules/*" \
            ! -path "*/node_modules/*" \
            ! -path "./CODE.md" \
            ! -path "./public_html.zip" \
            | sort | while read -r file
          do
            echo "Processing: $file"

            # Skip binary files
            if ! grep -Iq . "$file" 2>/dev/null; then
              echo "Skipping binary: $file"
              continue
            fi

            path="${file#./}"

            case "$file" in
              *.php) lang="php" ;;
              *.html|*.htm) lang="html" ;;
              *.css) lang="css" ;;
              *.js) lang="javascript" ;;
              *.json) lang="json" ;;
              *.sql) lang="sql" ;;
              *.xml) lang="xml" ;;
              *.svg) lang="xml" ;;
              *.yml|*.yaml) lang="yaml" ;;
              *.env) lang="dotenv" ;;
              */.env) lang="dotenv" ;;
              *.htaccess) lang="apache" ;;
              *.sh) lang="bash" ;;
              *.py) lang="python" ;;
              *.md) lang="markdown" ;;
              *.txt) lang="text" ;;
              *) lang="text" ;;
            esac

            {
              echo "## \`$path\`"
              echo ""
              echo '```'"$lang"
              cat "$file"
              echo ""
              echo '```'
              echo ""
              echo "---"
              echo ""
            } >> CODE.md

          done

          echo "CODE.md generated."
          wc -l CODE.md
          du -h CODE.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A public_html CODE.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract public_html and regenerate CODE.md"

          git push origin main
