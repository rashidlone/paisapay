name: Generate Code Markdown

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete old public_html and CODE.md
        run: |
          echo "Deleting old public_html folder..."
          rm -rf public_html

          echo "Deleting old CODE.md..."
          rm -f CODE.md

      - name: Extract public_html.zip
        run: |
          if [ ! -f "public_html.zip" ]; then
            echo "ERROR: public_html.zip not found!"
            exit 1
          fi

          echo "Extracting public_html.zip..."

          mkdir -p public_html

          unzip -o public_html.zip -d public_html

          echo "Extraction completed."

      - name: Generate CODE.md
        shell: bash
        run: |
          echo "Generating CODE.md..."

          cat > CODE.md <<'EOF'
          # Paisapay Source Code

          This file contains the source code of the project.

          Vendor dependencies, node_modules, binary files, and ZIP files are excluded.

          ---

          EOF

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./vendor/*" \
            ! -path "*/vendor/*" \
            ! -path "./node_modules/*" \
            ! -path "*/node_modules/*" \
            ! -path "./CODE.md" \
            ! -path "./public_html.zip" \
            | sort | while read -r file
          do

            echo "Processing: $file"

            # Skip binary files
            if ! grep -Iq . "$file" 2>/dev/null; then
              echo "Skipping binary: $file"
              continue
            fi

            path="${file#./}"

            case "$file" in
              *.php)
                lang="php"
                ;;
              *.html|*.htm)
                lang="html"
                ;;
              *.css)
                lang="css"
                ;;
              *.js)
                lang="javascript"
                ;;
              *.json)
                lang="json"
                ;;
              *.sql)
                lang="sql"
                ;;
              *.xml)
                lang="xml"
                ;;
              *.svg)
                lang="xml"
                ;;
              *.yml|*.yaml)
                lang="yaml"
                ;;
              *.env)
                lang="dotenv"
                ;;
              */.env)
                lang="dotenv"
                ;;
              *.htaccess)
                lang="apache"
                ;;
              *.sh)
                lang="bash"
                ;;
              *.py)
                lang="python"
                ;;
              *.md)
                lang="markdown"
                ;;
              *.txt)
                lang="text"
                ;;
              *)
                lang="text"
                ;;
            esac

            {
              echo "## \`$path\`"
              echo ""
              echo '```'"$lang"
              cat "$file"
              echo ""
              echo '```'
              echo ""
              echo "---"
              echo ""
            } >> CODE.md

          done

          echo ""
          echo "================================"
          echo "CODE.md generated successfully"
          echo "================================"
          echo ""

          wc -l CODE.md
          du -h CODE.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Getting latest changes from GitHub..."
          git fetch origin main

          echo "Rebasing on latest main..."
          git rebase origin/main

          echo "Adding public_html and CODE.md..."
          git add public_html CODE.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract public_html and regenerate CODE.md"

          echo "Pushing changes..."
          git push origin HEAD:main
