name: Generate Code Markdown

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip public_html.zip
        run: |
          if [ -f "public_html.zip" ]; then
            rm -rf public_html
            mkdir -p public_html
            unzip -o public_html.zip -d public_html
          fi

      - name: Generate CODE.md
        run: |
          echo "# Repository Source Code" > CODE.md
          echo "" >> CODE.md

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./CODE.md" \
            ! -path "./public_html.zip" \
            ! -path "./node_modules/*" \
            ! -path "./vendor/*" \
            | sort | while read -r file
          do
            echo "Processing: $file"

            # Skip binary files
            if ! grep -Iq . "$file" 2>/dev/null; then
              echo "Skipping binary: $file"
              continue
            fi

            path="${file#./}"

            case "$file" in
              *.php) lang="php" ;;
              *.html|*.htm) lang="html" ;;
              *.css) lang="css" ;;
              *.js) lang="javascript" ;;
              *.json) lang="json" ;;
              *.sql) lang="sql" ;;
              *.xml) lang="xml" ;;
              *.svg) lang="xml" ;;
              *.yml|*.yaml) lang="yaml" ;;
              *.env) lang="dotenv" ;;
              *.htaccess) lang="apache" ;;
              *.sh) lang="bash" ;;
              *.py) lang="python" ;;
              *.md) lang="markdown" ;;
              *.txt) lang="text" ;;
              *) lang="text" ;;
            esac

            {
              echo "## \`$path\`"
              echo ""
              echo '```'"$lang"
              cat "$file"
              echo ""
              echo '```'
              echo ""
              echo "---"
              echo ""
            } >> CODE.md

          done

      - name: Commit CODE.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CODE.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate complete source code documentation"
            git push
          fi
